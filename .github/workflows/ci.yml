name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend frontend scripts
      - name: Test
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q backend frontend scripts
      - name: Check dependency consistency
        run: pip check
